apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-gitops-app
  labels:
    app: eks-gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eks-gitops-app
  template:
    metadata:
      labels:
        app: eks-gitops-app
    spec:
      containers:
        - name: eks-gitops-app
          image: 825276341358.dkr.ecr.us-east-2.amazonaws.com/eks-gitops-app:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
